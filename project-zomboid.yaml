AWSTemplateFormatVersion: 2010-09-09
Description: >
  Project Zomboid dedicated server on ECS Fargate Spot + EFS.
  Switch DesiredTaskCount between 0 and 1 to stop or start the server.
  At each startup the task copies server configuration files from S3 to EFS.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Game Server Settings" }
        Parameters:
          - ServerName
          - AdminPassword
          - MaxPlayers
      - Label: { default: "Container Resource Limits" }
        Parameters:
          - ContainerCPU
          - ContainerMemory
      - Label: { default: "Operation" }
        Parameters:
          - DesiredTaskCount

Parameters:
  ServerName:
    Type: String
    Default: MyZomboidServer
    Description: "Value passed to SERVER_NAME environment variable"
  AdminPassword:
    Type: String
    NoEcho: true
    Description: "Value passed to ADMIN_PASSWORD environment variable"
  MaxPlayers:
    Type: Number
    Default: 16
    Description: "Maximum number of players"
  DesiredTaskCount:
    Type: Number
    AllowedValues: [0, 1]
    Default: 0
    Description: "1 = running, 0 = stopped"
  ContainerCPU:
    Type: Number
    Default: 1024   # 1 vCPU
    Description: "Fargate task CPU units"
  ContainerMemory:
    Type: Number
    Default: 3072   # 3 GiB
    Description: "Fargate task memory (MiB)"

Conditions:
  CreateNLB: !Not [!Equals [!Ref DesiredTaskCount, 0]]
  StopServer: !Equals [!Ref DesiredTaskCount, 0]

Resources:
  # ---------- Network ----------
  GameVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachIgw:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:  !Ref GameVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:            !Ref GameVpc
      CidrBlock:        10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-pub-a"}]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:            !Ref GameVpc
      CidrBlock:        10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-pub-b"}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GameVpc
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:         !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:            !Ref InternetGateway
  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:     !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:     !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ---------- Security Group ----------
  GameSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Project Zomboid ports
      VpcId: !Ref GameVpc
      SecurityGroupIngress:
        # Health check port (TCP)
        - IpProtocol: tcp
          FromPort: 16262
          ToPort: 16262
          CidrIp: 0.0.0.0/0
        # Steam query ports (optional but useful for server browser)
        - IpProtocol: udp
          FromPort: 8766
          ToPort: 8767
          CidrIp: 0.0.0.0/0
        # Main game ports
        - IpProtocol: udp
          FromPort: 16261
          ToPort: 16262
          CidrIp: 0.0.0.0/0
        # RCON port
        - IpProtocol: tcp
          FromPort: 27015
          ToPort: 27015
          CidrIp: 0.0.0.0/0

  # Security group allowing NFS from ECS tasks to EFS mount targets
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow NFS from ECS tasks
      VpcId: !Ref GameVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref GameSecurityGroup

  # ---------- Persistent Storage (EFS) ----------
  PzFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref PzFileSystem
      SubnetId:     !Ref PublicSubnetA
      SecurityGroups: [!GetAtt EfsSecurityGroup.GroupId]
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref PzFileSystem
      SubnetId:     !Ref PublicSubnetB
      SecurityGroups: [!GetAtt EfsSecurityGroup.GroupId]

  # ---------- S3 Configuration Files ----------
  ConfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  # ---------- IAM ----------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadConfigFromS3
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ConfigBucket.Arn}/*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EFSMount
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt PzFileSystem.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ConfigBucket}"
                  - !Sub "arn:aws:s3:::${ConfigBucket}/*"

  # ---------- ECS ----------
  PzCluster:
    Type: AWS::ECS::Cluster

  FargateSpotAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref PzCluster
      CapacityProviders: [FARGATE_SPOT]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1

  PzTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: !Ref ContainerCPU
      Memory: !Ref ContainerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: pzdata
          EFSVolumeConfiguration:
            FilesystemId: !Ref PzFileSystem
            TransitEncryption: ENABLED
      ContainerDefinitions:
        - Name: zomboid
          Image: cm2network/steamcmd:latest
          Essential: true
          User: root
          PortMappings:
            # Main game ports
            - ContainerPort: 16261
              Protocol: udp
            - ContainerPort: 16262
              Protocol: udp
            # Steam query ports
            - ContainerPort: 8766
              Protocol: udp
            - ContainerPort: 8767
              Protocol: udp
            # RCON port
            - ContainerPort: 27015
              Protocol: tcp
          Environment:
            - Name: SERVER_NAME
              Value: !Ref ServerName
            - Name: ADMIN_PASSWORD
              Value: !Ref AdminPassword
            - Name: MAX_PLAYERS
              Value: !Ref MaxPlayers
            - Name: BUCKET_NAME
              Value: !Ref ConfigBucket
            - Name: CONFIG_URL
              Value: !Sub "s3://${ConfigBucket}/pz-config/servertest.ini"
            - Name: CONTAINER_MEMORY
              Value: !Ref ContainerMemory
          Command:
            - /bin/sh
            - -c
            - |
              set -e
              export HOME=/home/steam
              mkdir -p "$HOME" "$HOME/Steam" || true
              # Update / install the official server with SteamCMD (app ID 380870)
              echo "Running SteamCMD to install/update Project Zomboid dedicated server..."
              /home/steam/steamcmd/steamcmd.sh +login anonymous \
                       +force_install_dir /home/steam/pzserver \
                       +app_update 380870 validate \
                       +quit

              echo "Installing AWS CLI and required libs..."
              apt-get update && apt-get install -y awscli screen lib32gcc-s1 lib32stdc++6 libnss3 || true

              echo "Fetching server settings from S3 (if exists)..."
              mkdir -p /home/steam/Zomboid/Server /home/steam/Zomboid/Logs || true
              CONFIG_BASE="s3://$BUCKET_NAME/pz-config"
              
              # Get main server config and rename to $SERVER_NAME.ini
              echo "Downloading server settings and renaming to $SERVER_NAME.ini, etc..."
              aws s3 cp "$CONFIG_BASE/servertest.ini" "/home/steam/Zomboid/Server/$SERVER_NAME.ini" || echo "No servertest.ini found in S3"
              
              # Get additional Lua config files with server name in filename
              aws s3 cp "$CONFIG_BASE/servertest_SandboxVars.lua" "/home/steam/Zomboid/Server/${SERVER_NAME}_SandboxVars.lua" || echo "No servertest_SandboxVars.lua found in S3"
              aws s3 cp "$CONFIG_BASE/servertest_spawnpoints.lua" "/home/steam/Zomboid/Server/${SERVER_NAME}_spawnpoints.lua" || echo "No servertest_spawnpoints.lua found in S3"
              aws s3 cp "$CONFIG_BASE/servertest_spawnregions.lua" "/home/steam/Zomboid/Server/${SERVER_NAME}_spawnregions.lua" || echo "No servertest_spawnregions.lua found in S3"

              # Ensure ownership so that the steam user can write to EFS
              chown -R steam:steam /home/steam/Zomboid /home/steam/pzserver || true

              echo "Starting Project Zomboid server as steam user..."
              # Calculate heap size based on container memory (use ~50% for initial and ~70% for max)
              MEMORY_MB=$CONTAINER_MEMORY
              INIT_HEAP=$(( MEMORY_MB / 2 ))
              MAX_HEAP=$(( MEMORY_MB * 7 / 10 ))
              echo "Container memory: ${MEMORY_MB}MB, Initial heap: ${INIT_HEAP}MB, Max heap: ${MAX_HEAP}MB"
              
              # ------------------------------
              # Apply container-based heap size to ProjectZomboid64.json
              # ------------------------------
              CONF=/home/steam/pzserver/ProjectZomboid64.json
              echo "Updating JVM options in $CONF …"
              if [ -f "$CONF" ]; then
                sed -i -E \
                  -e "s/\"-Xms[0-9]+[gGmM]?\"/\"-Xms${INIT_HEAP}m\"/" \
                  -e "s/\"-Xmx[0-9]+[gGmM]?\"/\"-Xmx${MAX_HEAP}m\"/" \
                  "$CONF"
              else
                echo "WARNING: $CONF not found; skip memory tuning"
              fi
              
              # ------------------------------
              # Start server process in foreground (exec)
              # ------------------------------
              exec su - steam -c "/home/steam/pzserver/start-server.sh \
                -servername \"$SERVER_NAME\" \
                -adminpassword \"$ADMIN_PASSWORD\" \
                -maxplayers \"$MAX_PLAYERS\""
          MountPoints:
            - SourceVolume: pzdata
              ContainerPath: /home/steam/Zomboid
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ZomboidLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: zomboid

        # Dedicated health check sidecar container
        - Name: health-listener
          Image: alpine:latest
          Essential: true
          Command:
            - /bin/sh
            - -c
            - |
              # Install necessary tools
              apk add --no-cache socat
              
              # Start health check listener on TCP port 16262
              echo "Starting dedicated health check listener on port 16262..."
              # Use a simple HTTP response instead of just ECHO to be more compatible with NLB health checks
              socat TCP-LISTEN:16262,fork,reuseaddr,bind=0.0.0.0 SYSTEM:'echo -e "HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nOK"' &
              
              # Keep container running and log status periodically
              while true; do
                echo "Health check listener is running on port 16262..."
                sleep 30
              done
          PortMappings:
            - ContainerPort: 16262
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ZomboidLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: health

  # ---------- NLB (Game Ports) ----------
  GameNlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: CreateNLB
    Properties:
      Type: network
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: "true"

  # Game client connection (UDP)
  GameTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateNLB
    Properties:
      Port: 16261
      Protocol: UDP
      TargetType: ip
      VpcId: !Ref GameVpc
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP  # UDP health checks not supported, must use TCP
      HealthCheckPort: "16262"
      HealthCheckIntervalSeconds: 60
      HealthCheckTimeoutSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  # Steam query port for server status (UDP)
  SteamQueryTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateNLB
    Properties:
      Port: 8766
      Protocol: UDP
      TargetType: ip
      VpcId: !Ref GameVpc
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckPort: "16262"
      HealthCheckIntervalSeconds: 60
      HealthCheckTimeoutSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  # Secondary Steam query port
  SteamQueryTargetGroup2:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateNLB
    Properties:
      Port: 8767
      Protocol: UDP
      TargetType: ip
      VpcId: !Ref GameVpc
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckPort: "16262"
      HealthCheckIntervalSeconds: 60
      HealthCheckTimeoutSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  # RCON port target group
  RconTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateNLB
    Properties:
      Port: 27015
      Protocol: TCP
      TargetType: ip
      VpcId: !Ref GameVpc
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckPort: "16262"
      HealthCheckIntervalSeconds: 60
      HealthCheckTimeoutSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  GameListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateNLB
    Properties:
      LoadBalancerArn: !Ref GameNlb
      Port: 16261
      Protocol: UDP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GameTargetGroup

  SteamQueryListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateNLB
    Properties:
      LoadBalancerArn: !Ref GameNlb
      Port: 8766
      Protocol: UDP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SteamQueryTargetGroup

  SteamQueryListener2:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateNLB
    Properties:
      LoadBalancerArn: !Ref GameNlb
      Port: 8767
      Protocol: UDP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SteamQueryTargetGroup2

  RconListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateNLB
    Properties:
      LoadBalancerArn: !Ref GameNlb
      Port: 27015
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref RconTargetGroup

  # ---------- ECS Services ----------
  # Service with load balancer (when running)
  PzServiceWithLb:
    Type: AWS::ECS::Service
    Condition: CreateNLB
    DependsOn: [MountTargetA, MountTargetB, GameListener, SteamQueryListener, SteamQueryListener2, RconListener]
    Properties:
      Cluster: !Ref PzCluster
      TaskDefinition: !Ref PzTaskDef
      DesiredCount: !Ref DesiredTaskCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref GameSecurityGroup]
      LoadBalancers:
        - TargetGroupArn: !Ref GameTargetGroup
          ContainerName: zomboid
          ContainerPort: 16261
        - TargetGroupArn: !Ref SteamQueryTargetGroup
          ContainerName: zomboid
          ContainerPort: 8766
        - TargetGroupArn: !Ref SteamQueryTargetGroup2
          ContainerName: zomboid
          ContainerPort: 8767
        - TargetGroupArn: !Ref RconTargetGroup
          ContainerName: zomboid
          ContainerPort: 27015

  # Service without load balancer (when stopped)
  PzServiceWithoutLb:
    Type: AWS::ECS::Service
    Condition: StopServer
    DependsOn: [MountTargetA, MountTargetB]
    Properties:
      Cluster: !Ref PzCluster
      TaskDefinition: !Ref PzTaskDef
      DesiredCount: !Ref DesiredTaskCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref GameSecurityGroup]

  # ---------- CloudWatch Logs ----------
  ZomboidLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/zomboid"
      RetentionInDays: 14

Outputs:
  GameNlbDnsName:
    Description: "Connect address (UDP port 16261)"
    Condition: CreateNLB
    Value: !GetAtt GameNlb.DNSName
  ConfigBucketName:
    Description: "Upload servertest.ini and *_SandboxVars.lua files to pz-config/ folder"
    Value: !Ref ConfigBucket
  EfsId:
    Description: "Persistent world data EFS ID"
    Value: !Ref PzFileSystem
  ServiceStatus:
    Description: "Service status (running or stopped)"
    Value: !If [CreateNLB, "Server running - use GameNlbDnsName to connect", "Server stopped"] 
